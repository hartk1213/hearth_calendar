<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hearth</title>
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#f7f3ec">
<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#2b2622;--muted:#8a8178;--line:#ebe4d9;--accent:#d9693b;--radius:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.banner{background:#fff1cc;color:#6b5100;text-align:center;font-size:14px;padding:7px 12px}
header{display:flex;align-items:center;gap:24px;padding:16px 24px 10px}
.clock{font-size:54px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.clock small{font-size:20px;font-weight:600;letter-spacing:0;margin-left:4px;color:var(--muted)}
.date{font-size:19px;color:var(--muted);margin-top:4px}
.weather{display:flex;align-items:center;gap:10px}
.weather .icon{font-size:38px}
.weather .wt{font-size:26px;font-weight:650}
.weather .wl{font-size:14px;color:var(--muted)}
.spacer{flex:1}
nav.tabs{display:flex;gap:4px;background:#ece5da;padding:5px;border-radius:999px}
nav.tabs button{border:0;background:transparent;font-size:17px;padding:11px 18px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{flex:1;min-height:0;padding:6px 24px 20px;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.toolbar h2{font-size:25px;margin:0 6px;font-weight:700}
.btn{border:0;background:var(--card);font-size:17px;padding:10px 16px;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.07);min-height:46px;font-weight:550}
.btn.primary{background:var(--accent);color:#fff}
.btn.icon{width:46px;padding:0;font-size:24px}
.btn.danger{color:#c0392b}
.btn.on{background:var(--ink);color:#fff}
.seg{display:flex;background:#ece5da;border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;font-size:16px;padding:9px 14px;border-radius:9px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;border:0;background:var(--card);border-radius:999px;padding:5px 13px 5px 5px;font-size:15px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chip.off{opacity:.35}
.av{width:28px;height:28px;border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av.big{width:46px;height:46px;font-size:19px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);text-align:center;margin:18px 0;font-size:15px}

/* week */
.week{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:10px;overflow-x:auto}
.day{background:var(--card);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.day-h{padding:10px 12px 6px;display:flex;align-items:center;gap:8px}
.day-h .dn{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.day-h .num{font-size:22px;font-weight:700;min-width:36px;height:36px;display:inline-grid;place-items:center}
.day.today .num{background:var(--accent);color:#fff;border-radius:999px}
.day-body{flex:1;overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:6px}
.day-meal{border-top:1px dashed var(--line);padding:8px 12px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{border-radius:10px;padding:7px 9px;background:color-mix(in srgb,var(--c) 15%,white);border-left:4px solid var(--c);font-size:14px;line-height:1.25;cursor:pointer}
.ev .t{font-size:12px;color:var(--muted);font-weight:650}
.ev .n{font-weight:600;overflow-wrap:anywhere}
.ev.allday{background:var(--c);color:#fff;border-left:0}
.ev.allday .t{color:rgba(255,255,255,.85)}

/* month */
.month{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto repeat(6,minmax(0,1fr));gap:6px;min-height:0}
.mh{text-align:center;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mc{background:var(--card);border-radius:12px;padding:6px 7px;overflow:hidden;display:flex;flex-direction:column;gap:3px;min-height:0;cursor:pointer}
.mc.other{opacity:.45}
.mc .num{font-weight:700;font-size:15px}
.mc.today .num{color:var(--accent)}
.mchip{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.mchip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.more{font-size:11px;color:var(--muted)}

/* agenda */
.agenda{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.ag-day h3{margin:0 0 7px;font-size:18px}
.ag-day .evs{display:flex;flex-direction:column;gap:6px;max-width:720px}

/* chores */
.board{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;min-height:0}
.col{background:var(--card);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0}
.col-h{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.pname{font-size:19px;font-weight:700}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.progress>i{display:block;height:100%;background:var(--c);transition:width .3s}
.col-b{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.chore{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg);font-size:17px;cursor:pointer}
.chore .ck{width:36px;height:36px;border-radius:50%;border:3px solid var(--c);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.chore.done .ck{background:var(--c)}
.chore .ct{flex:1}
.chore.done .ct{text-decoration:line-through;color:var(--muted)}
.kebab{border:0;background:none;font-size:22px;color:var(--muted);padding:2px 8px;line-height:1}

/* lists */
.lists{flex:1;display:grid;grid-template-columns:220px 1fr;gap:14px;min-height:0}
.list-nav{display:flex;flex-direction:column;gap:6px}
.list-nav .btn{text-align:left;display:flex;justify-content:space-between}
.list-nav .count{opacity:.6}
.list-main{background:var(--card);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;padding:14px}
.add-row{display:flex;gap:8px;margin-bottom:6px}
.add-row input{flex:1}
.items{flex:1;overflow-y:auto}
.item{display:flex;align-items:center;gap:14px;padding:13px 6px;border-bottom:1px solid var(--line);font-size:18px;cursor:pointer}
.item .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:#fff;font-weight:800}
.item.done{color:var(--muted)}
.item.done .box{background:var(--muted);border-color:var(--muted)}
.item.done .txt{text-decoration:line-through}
.list-foot{display:flex;gap:8px;padding-top:10px}

/* meals */
.meals{flex:1;overflow:auto;background:var(--card);border-radius:var(--radius);padding:4px 14px}
.meal-row{display:grid;grid-template-columns:90px repeat(3,minmax(120px,1fr));gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.meal-row:last-child{border-bottom:0}
.meal-row.head{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.06em}
.meal-row .d{color:var(--muted);font-weight:600;font-size:14px}
.meal-row .d b{display:block;font-size:22px;color:var(--ink)}
.meal-row.today .d,.meal-row.today .d b{color:var(--accent)}
.meal-row input{width:100%}

/* forms + modal */
input,select{font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text;min-height:46px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(30,25,20,.35);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--card);border-radius:20px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{margin:0 0 14px;font-size:22px}
.modal .meta{margin:6px 0;font-size:17px;display:flex;align-items:center;gap:8px}
.modal .evs{display:flex;flex-direction:column;gap:6px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;flex:1;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:650}
.row{display:flex;gap:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.check{display:flex;align-items:center;gap:10px;font-size:16px;margin:0 0 12px}
.check input{width:24px;height:24px;min-height:0}
.days-pick{display:flex;gap:6px}
.days-pick button{flex:1;padding:11px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:650}
.days-pick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

#night{position:fixed;inset:0;background:#000;color:#3a3a3a;display:none;place-items:center;z-index:50;font-size:140px;font-weight:200}
body.night #night{display:grid}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
#toast.show{opacity:1}

@media (max-width:760px){
  header{flex-wrap:wrap;gap:12px;padding:12px 14px 8px}
  .clock{font-size:38px}
  nav.tabs{order:5;width:100%;overflow-x:auto}
  nav.tabs button{flex:1;padding:10px 8px;font-size:15px}
  main{padding:6px 12px 12px}
  .toolbar h2{font-size:20px;width:100%;order:-1;margin:0}
  .lists{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .list-nav{flex-direction:row;overflow-x:auto}
  .list-nav .btn{white-space:nowrap;gap:8px}
  .meal-row{grid-template-columns:56px repeat(3,minmax(110px,1fr))}
  .mchip{font-size:10px}
  .mchip i{display:none}
}

/* settings + setup */
.settings{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;max-width:880px;width:100%;padding-bottom:20px}
.sect{background:var(--card);border-radius:var(--radius);padding:18px 20px}
.sect h3{margin:0 0 4px;font-size:20px}
.sect .sub{margin:0 0 10px;color:var(--muted);font-size:15px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow .grow{flex:1;min-width:0}
.srow .grow>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow-actions{padding-top:12px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.sgrid{display:grid;grid-template-columns:200px 1fr;gap:14px 18px;align-items:center}
.sgrid>label{font-weight:600}
.sgrid .seg{width:max-content;max-width:100%;overflow-x:auto}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.status{font-size:15px;margin-top:8px;min-height:1em}
.status.err{color:#c0392b}
details.help{font-size:14px;color:var(--muted);margin:-4px 0 12px}
details.help summary{cursor:pointer;color:var(--accent);font-weight:600;padding:4px 0}
details.help li{margin:6px 0;line-height:1.4}
.results{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.btn.result{text-align:left}
.empty-card{background:var(--card);border:2px dashed var(--line);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.empty-card p{margin:0;flex:1;font-size:17px}
.setup-wrap{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:10px 0 30px}
.setup{background:var(--card);border-radius:22px;padding:28px 30px;width:min(680px,100%);height:max-content;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.setup h2{font-size:30px;margin:12px 0 6px}
.setup .lead{font-size:18px;color:var(--muted);margin:0 0 20px;line-height:1.45}
.setup .actions{margin-top:24px}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.btn:disabled{opacity:.45}
#pinmodal{z-index:30}
@media (max-width:760px){.sgrid{grid-template-columns:1fr;gap:8px}.sgrid>label{margin-top:8px}.setup{padding:20px}}

/* pantry + meal ideas */
.meals-layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px}
.pantry{background:var(--card);border-radius:var(--radius);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.pantry h3{margin:0;font-size:19px}
.pantry-h{display:flex;align-items:center;justify-content:space-between}
.pantry p{margin:0}
.linkish{border:0;background:none;color:var(--accent);font-weight:650;font-size:14px;padding:6px 4px;cursor:pointer}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border-radius:999px;padding:5px 4px 5px 12px;font-size:15px}
.pchip button{border:0;background:none;font-size:18px;line-height:1;color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer}
.ideas{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.ideas .seg{align-self:flex-start}
.btn.wide{width:100%}
.ideas-off{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.idea{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.idea-name{font-weight:700;font-size:18px}
.idea-desc{font-size:15px}
.need{display:flex;align-items:center;gap:8px;font-size:14px;color:#9a5b12;flex-wrap:wrap}
.need.ok{color:#2e7d4f}
.steps{font-size:14px}
.steps summary{cursor:pointer;color:var(--accent);font-weight:600}
.steps ol{margin:6px 0 0;padding-left:20px}
.steps li{margin:3px 0}
.plan-row{display:flex;gap:8px}
.plan-row select{flex:1}
@media (max-width:1100px){.meals-layout{grid-template-columns:1fr;overflow-y:auto}.meals{flex:none}.pantry{overflow:visible}}

.idea-btns{display:flex;gap:8px;flex-wrap:wrap}
.idea-btns .btn{flex:1;min-width:140px}
.idea-img{width:100%;height:140px;object-fit:cover;border-radius:10px}
.linkish.left{align-self:flex-start;padding-left:0}
.recipe h4{margin:14px 0 6px;font-size:16px}
.recipe-img{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.ingr{margin:0;padding-left:20px}
.ingr li{margin:4px 0}
.ingr li.miss{color:#9a5b12}
.ingr .tag{margin-left:8px;font-size:11px;font-weight:700;text-transform:uppercase;background:#fbe6cc;color:#9a5b12;border-radius:6px;padding:1px 6px}
.rsteps{margin:0;padding-left:22px}
.rsteps li{margin:6px 0;line-height:1.45}
.recipe a{color:var(--accent);font-weight:600}
.btn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn.spin{animation:none;opacity:.5}}

/* star rewards */
.star-total{font-weight:800;font-size:18px;white-space:nowrap}
.chore .stars{font-size:13px;white-space:nowrap}
.rewards{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
.rewards h3{margin:8px 0 0;font-size:19px}
.star-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.star-card{background:var(--card);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;border-top:5px solid var(--c)}
.star-card .grow{flex:1}
.star-big{font-size:30px;font-weight:800}
.adj{display:flex;flex-direction:column;gap:6px}
.adj .btn{min-height:40px;width:40px;font-size:20px}
.reward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.reward{background:var(--card);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.kebab.corner{position:absolute;top:6px;right:6px}
.reward-emoji{font-size:44px;line-height:1.1}
.reward-title{font-weight:700;font-size:18px}
.reward-cost{font-weight:800;color:#a8740f}
.redeem{display:flex;flex-direction:column;gap:6px;width:100%}
.redeem .btn{display:flex;align-items:center;gap:8px;justify-content:center;border:2px solid var(--c)}
.star-log{background:var(--card);border-radius:var(--radius);padding:4px 14px}
.star-log .pos{color:#2e7d4f}.star-log .neg{color:#c0392b}
.emoji-in{text-align:center;font-size:24px}
.idea-chip{border:0;cursor:pointer;padding:8px 12px}
/* day view */
.dayview-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.dayview{flex:1}
.day-h.person{gap:10px;border-bottom:4px solid var(--c);padding-bottom:10px}
.day-h .pn{font-weight:700;font-size:18px}
.day-dinner{background:var(--card);border-radius:12px;padding:10px 16px;font-size:16px}
/* import */
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.file-btn{display:flex;justify-content:center;align-items:center;width:100%;margin-bottom:10px;border:2px dashed var(--line);box-shadow:none;cursor:pointer;min-height:60px}
.import-preview img{max-width:100%;max-height:180px;border-radius:10px;display:block;margin:0 auto 10px}
textarea{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;width:100%;resize:vertical;user-select:text;-webkit-user-select:text}
.modal:has(.imp-list){width:min(760px,100%)}
.imp-list{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto}
.imp-row{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:10px}
.imp-row>input[type=checkbox]{width:24px;height:24px;min-height:0;margin-top:10px;flex:none}
.imp-fields{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.imp-line{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.imp-line input[type=date]{flex:1 1 140px}.imp-line input[type=time]{flex:1 1 100px}.imp-line select{flex:1 1 120px}
</style>
</head>
<body>
<div id="banner" class="banner" hidden>Demo mode: a sample family with made-up events. Changes are saved only in this browser.</div>
<header>
  <div>
    <div class="clock"><span id="clock"></span><small id="ampm"></small></div>
    <div class="date" id="date"></div>
  </div>
  <div class="weather" id="weather"></div>
  <div class="spacer"></div>
  <nav class="tabs">
    <button data-tab="calendar">Calendar</button>
    <button data-tab="chores">Chores</button>
    <button data-tab="lists">Lists</button>
    <button data-tab="meals">Meals</button>
    <button data-tab="settings" aria-label="Settings">⚙ Settings</button>
  </nav>
</header>
<main></main>
<div id="night"></div>
<div id="toast"></div>

<script>
"use strict";
/* ---------- tiny helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }

async function settingsCall(method, path, body) {
  if (API.demo) return demoSettingsCall(method, path, body);
  if (API.offline) throw new Error("Can't reach the Hearth server right now.");
  for (let tries = 0; ; tries++) {
    let r;
    try {
      r = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-Hearth-Pin": PIN }, body: body ? JSON.stringify(body) : undefined });
    } catch { throw new Error("Can't reach the Hearth server right now."); }
    const j = await r.json().catch(() => ({}));
    if (r.status === 403 && j.error === "pin") {
      if (!(await askPin(tries > 0))) throw new Error("cancelled");

    }
    if (!r.ok) throw new Error(j.error || "Something went wrong. Try again.");
    applyConfig(j.config);
    return j;
  }
}

    } else {

/* first-time setup */
function renderSetup(m) {
  const step = UI.setupStep || 0, go = n => { UI.setupStep = n; render(); };
  const dots = h("div", { class: "dots" }, [0, 1, 2, 3].map(i => h("i", { class: i === step ? "on" : "" })));
  const nav = (back, next, label, ok = true) => h("div", { class: "actions" },
    back ? h("button", { class: "btn", onclick: back }, "Back") : null, h("div", { class: "spacer" }),
    h("button", { class: "btn primary", disabled: !ok, onclick: next }, label));
  const card = h("div", { class: "setup" }, dots);
  if (step === 0) {
    const t = h("input", { value: CFG.title && CFG.title !== "Our Family" ? CFG.title : "", placeholder: "e.g. The Parkers" });
    card.append(h("h2", {}, "Welcome to Hearth"),
      h("p", { class: "lead" }, "Let's set up your family calendar. It takes about two minutes, and you can change anything later in Settings."),
      field("What should we call your calendar?", t),
      nav(null, async () => { if (await saveSettings({ title: t.value.trim() || "Our Family" })) go(1); }, "Let's go"));
  } else if (step === 1) {
    card.append(h("h2", {}, "Who lives here?"),
      h("p", { class: "lead" }, "Add each person who should have their own color on the calendar and their own chore list."),
      familyEditor(), nav(() => go(0), () => go(2), "Next", members().length > 0));
  } else if (step === 2) {

  } else {

/* ---------- background loops ---------- */
const homeView = () => innerWidth < 760 ? "agenda" : (CFG.default_view || "week");
const isTyping = () => { const a = document.activeElement; return !!a && (a.tagName === "INPUT" || a.tagName === "SELECT"); };
async function poll() {
  if (API.offline) {  // reload as soon as the server is back
    try { if ((await fetch("api/health", { cache: "no-store" })).ok) location.reload(); } catch {}
    return;
  }
  if (API.demo || saving || $("#modal") || $("#pinmodal")) return;
  try {  // pick up settings changed from another screen or phone
    const r = await fetch("api/config", { cache: "no-store" });
    if (r.ok) {
      const c = await r.json();
      if (JSON.stringify(c) !== JSON.stringify(CFG) && !isTyping()) { applyConfig(c); render(); loadFeeds(); }
    }
  } catch {}
  try {
    const s = await API.state();
    if (s.rev !== STATE.rev && !isTyping()) { STATE = s; normalizeState(); render(); }
  } catch {}
}
function housekeeping() {
  if (ymd(new Date()) !== renderedDay && !isTyping()) { UI.mealsAnchor = null; render(); loadFeeds(); }
  const idleMs = (CFG.idle_reset_minutes || 3) * 60000, home = homeView();
  const atHome = UI.tab === "calendar" && UI.cal === home && ymd(UI.anchor) === ymd(new Date());
  if (Date.now() - lastTouch > idleMs) {
    PIN = "";  // re-lock settings when nobody is using the screen
    if (!atHome && UI.tab !== "setup") {
      closeModal(); closeModal("pinmodal"); if (document.activeElement) document.activeElement.blur();
      UI.tab = "calendar"; UI.cal = home; UI.anchor = startOfDay(new Date()); UI.mealsAnchor = null;
      refreshCal();
    }
  }
}

(async function init() {
  await API.init();
  document.title = CFG.title || "Hearth";
  applyScale();
  if (API.demo) { $("#banner").hidden = false; WX = { t: 64, code: 1, hi: 68, lo: 52 }; renderWeather(); }
  try { STATE = await API.state(); }
  catch { API.offline = true; STATE = cache.get("state") || { rev: -1 }; }
  if (API.offline) {
    const b = $("#banner"); b.hidden = false;
    b.textContent = "Can't reach the Hearth server. Showing the last saved copy; it will reconnect automatically.";
  }
  normalizeState();
  UI.cal = homeView();
  if (!API.demo && !API.offline && !CFG.setup_done) UI.tab = "setup";
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { UI.tab = b.dataset.tab; render(); if (UI.tab === "calendar") loadFeeds(); }));
  document.addEventListener("pointerdown", () => { lastTouch = Date.now(); }, true);
  $("#night").addEventListener("click", () => { wakeUntil = Date.now() + 2 * 60000; checkNight(); });
  render(); renderClock(); loadFeeds(); loadWeather();
  setInterval(renderClock, 1000);
  setInterval(poll, 20000);
  setInterval(loadFeeds, 60000);  // cheap: the server only re-downloads calendars as often as the setting allows
  setInterval(loadWeather, 30 * 60000);
  setInterval(housekeeping, 30000);
})();
