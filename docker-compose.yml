# Hearth - DIY family wall calendar
#
#   1. Copy .env.example to .env and fill it in (only TZ is really needed).
#   2. docker compose up -d
#   3. Open http://<this-computer>:8095 and follow the setup screens.
#
# "docker compose up -d" downloads the ready-made image.
# "docker compose up -d --build" builds it from this folder instead.

services:
  hearth:
    image: ghcr.io/hartk1213/hearth:latest
    build: .
    container_name: hearth
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "${HOST_PORT:-8095}:8080"
    environment:
      TZ: ${TZ:-Etc/UTC}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-hearth}
      DB_USER: ${DB_USER:-hearth}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
    volumes:
      - ./data:/config
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
